apiVersion: monitoring.rhobs/v1
kind: PodMonitor
metadata:
  name: mesh-lab-envoy
  namespace: mesh-lab
  labels:
    observability: platform
    laboratorio.sre.dev/proprietario: service-mesh-gitops
spec:
  namespaceSelector:
    matchNames:
    - mesh-lab
  selector:
    matchExpressions:
    - key: app
      operator: In
      values:
      - httpbin
      - sleep
      - sleep-denied
  podMetricsEndpoints:
  - port: http-envoy-prom
    path: /stats/prometheus
    interval: 30s
    relabelings:
    - sourceLabels:
      - __meta_kubernetes_pod_container_name
      regex: istio-proxy
      action: keep
