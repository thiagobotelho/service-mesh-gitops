apiVersion: monitoring.rhobs/v1
kind: PodMonitor
metadata:
  name: mesh-lab-envoy
  # Namespace deste objeto; não confundir com seleção de namespaces de origem.
  namespace: istio-system
  labels:
    observability: platform
    laboratorio.sre.dev/proprietario: service-mesh-gitops
spec:
  # Seleciona namespaces; conferir labels antes de ampliar o alcance.
  namespaceSelector:
    matchNames:
    - mesh-lab
  # Seletores precisam corresponder aos labels dos recursos de destino.
  selector:
    matchExpressions:
    - key: app
      operator: In
      values:
      - httpbin
      - sleep
      - sleep-denied
  podMetricsEndpoints:
  - port: http-envoy-prom
    path: /stats/prometheus
    interval: 30s
    relabelings:
    - sourceLabels:
      - __meta_kubernetes_pod_container_name
      regex: istio-proxy
      action: keep
