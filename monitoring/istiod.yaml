apiVersion: monitoring.rhobs/v1
kind: ServiceMonitor
metadata:
  name: mesh-crc-istiod
  namespace: istio-system
  labels:
    observability: platform
    laboratorio.sre.dev/proprietario: service-mesh-gitops
spec:
  # Seleciona namespaces; conferir labels antes de ampliar o alcance.
  namespaceSelector:
    matchNames:
    - istio-system
  # Seletores precisam corresponder aos labels dos recursos de destino.
  selector:
    matchLabels:
      app: istiod
    matchExpressions:
    - key: istio.io/tag
      operator: DoesNotExist
  endpoints:
  - port: http-monitoring
    path: /metrics
    interval: 30s
