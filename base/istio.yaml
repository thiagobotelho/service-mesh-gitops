apiVersion: sailoperator.io/v1
kind: Istio
metadata:
  name: mesh-crc
  labels:
    laboratorio.sre.dev/proprietario: service-mesh-gitops
spec:
  namespace: istio-system
  version: v1.30.5
  updateStrategy:
    type: InPlace
  values:
    pilot:
      autoscaleEnabled: false
      replicaCount: 1
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
    meshConfig:
      trustDomain: cluster.local
      discoverySelectors:
      - matchLabels:
          istio-discovery: mesh-crc
      accessLogFile: /dev/stdout
      accessLogEncoding: JSON
      accessLogFormat: |
        {
          "start_time": "%START_TIME%",
          "method": "%REQ(:METHOD)%",
          "path": "%REQ_WITHOUT_QUERY(:PATH)%",
          "protocol": "%PROTOCOL%",
          "response_code": "%RESPONSE_CODE%",
          "response_flags": "%RESPONSE_FLAGS%",
          "response_code_details": "%RESPONSE_CODE_DETAILS%",
          "connection_termination_details": "%CONNECTION_TERMINATION_DETAILS%",
          "downstream_remote_address": "%DOWNSTREAM_REMOTE_ADDRESS%",
          "downstream_local_address": "%DOWNSTREAM_LOCAL_ADDRESS%",
          "upstream_host": "%UPSTREAM_HOST%",
          "upstream_cluster": "%UPSTREAM_CLUSTER_RAW%",
          "duration_ms": "%DURATION%",
          "bytes_received": "%BYTES_RECEIVED%",
          "bytes_sent": "%BYTES_SENT%",
          "request_id": "%REQ(X-REQUEST-ID)%",
          "trace_id": "%TRACE_ID%",
          "downstream_tls_version": "%DOWNSTREAM_TLS_VERSION%",
          "downstream_peer_uri_san": "%DOWNSTREAM_PEER_URI_SAN%",
          "upstream_transport_failure_reason": "%UPSTREAM_TRANSPORT_FAILURE_REASON%"
        }
      defaultConfig:
        proxyStatsMatcher:
          inclusionRegexps:
          - .*no_filter_chain_match
          - .*ssl.connection_error
          - .*ssl.fail_verify_no_cert
          - .*ssl.fail_verify_error
