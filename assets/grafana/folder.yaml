apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaFolder
metadata:
  name: grafana-folder-service-mesh
  # Namespace deste objeto; não confundir com seleção de namespaces de origem.
  namespace: grafana
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  uid: service-mesh
  title: Service Mesh
  instanceSelector:
    matchLabels:
      dashboards: grafana
