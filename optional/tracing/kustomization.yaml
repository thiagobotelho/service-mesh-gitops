apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../overlays/desenvolvimento
- telemetry.yaml
patches:
- target:
    kind: Istio
    name: mesh-crc
  patch: "apiVersion: sailoperator.io/v1\nkind: Istio\nmetadata:\n  name: mesh-crc\n\
    spec:\n  values:\n    meshConfig:\n      enableTracing: true\n      extensionProviders:\n\
    \      - name: otel-existente\n        opentelemetry:\n          service: otel-collector-collector.observability.svc.cluster.local\n\
    \          port: 4317\n"
