  # Namespace deste objeto; não confundir com seleção de namespaces de origem.
  namespace: mesh-lab
  labels:
    laboratorio.sre.dev/proprietario: service-mesh-gitops
spec:
  tracing:
  - providers:
    - name: otel-existente
    randomSamplingPercentage: 100
