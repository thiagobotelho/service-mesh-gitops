apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../observability
patches:
- target:
    kind: Kiali
    name: kiali
  patch: "- op: replace\n  path: /spec/deployment/discovery_selectors/default\n  value:\n\
    \  - matchExpressions:\n    - key: istio-discovery\n      operator: In\n     \
    \ values:\n      - mesh-crc\n      - mesh-vault\n"
