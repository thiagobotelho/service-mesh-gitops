apiVersion: monitoring.rhobs/v1
kind: PodMonitor
metadata:
  name: mesh-vault-envoy
  namespace: istio-vault-system
  labels:
    observability: platform
spec:
  namespaceSelector:
    matchNames:
    - mesh-vault-lab
  selector:
    matchExpressions:
    - key: app
      operator: In
      values:
      - httpbin
      - sleep
  podMetricsEndpoints:
  - port: http-envoy-prom
    path: /stats/prometheus
    interval: 30s
    relabelings:
    - sourceLabels:
      - __meta_kubernetes_pod_container_name
      regex: istio-proxy
      action: keep
