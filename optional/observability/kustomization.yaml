apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../kiali
- telemetry.yaml
- prometheusrule.yaml
- kiali-readonly-rbac.yaml
patches:
- target:
    kind: Istio
    name: mesh-crc
  patch: |-
    apiVersion: sailoperator.io/v1
    kind: Istio
    metadata:
      name: mesh-crc
    spec:
      values:
        meshConfig:
          enableTracing: true
          extensionProviders:
          - name: otel-existente
            opentelemetry:
              service: otel-collector-collector.observability.svc.cluster.local
              port: 4317
- target:
    kind: Kiali
    name: kiali
  patch: |-
    apiVersion: kiali.io/v1alpha1
    kind: Kiali
    metadata:
      name: kiali
      namespace: istio-system
    spec:
      external_services:
        tracing:
          enabled: true
          provider: tempo
          use_grpc: false
          internal_url: https://tempo-tempo-monolithic-gateway.tempo.svc.cluster.local:8080/api/traces/v1/dev/tempo
          external_url: https://grafana-grafana.apps-crc.testing
          auth:
            type: bearer
            use_kiali_token: true
            insecure_skip_verify: false
          tempo_config:
            datasource_uid: tempo
            tenant: dev
            name: tempo-monolithic
            namespace: tempo
            url_format: grafana
